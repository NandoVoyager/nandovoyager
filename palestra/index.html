<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f5f5f3" />
<title>Palestras no Brasil — Nando Voyager</title>
<meta name="description" content="Meus primeiros eventos presenciais no Brasil: imersão em Santos e uma palestra na cidade mais votada. Vote na sua." />
<link rel="canonical" href="https://nandovoyager.com/palestra" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/icon.png" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter+Tight:wght@400;500;600;700;800&display=swap" />
<style>
/* /palestra: light page (very light grey, white cards, near-black text) with one accent colour.
   Mobile first; the two-column layouts start at 860px. Every text and number comes from conteudo.js and config.js. */
:root{--bg:#f5f5f3;--card:#fff;--ink:#111112;--mid:#6b6b6f;--line:rgba(17,17,18,.09);--accent:#e5372b;--green:#12905a;--blue:#2f63e0;--r:26px}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);-webkit-tap-highlight-color:transparent;scroll-behavior:smooth}
body{font:400 16px/1.5 'Inter Tight',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
a{color:inherit}
a,button,summary{touch-action:manipulation}
section{scroll-margin-top:88px}
.wrap{width:min(1040px,100% - 32px);margin:0 auto}
h1,h2,h3{font-weight:800;letter-spacing:-.035em;line-height:1.02;text-wrap:balance}
[hidden]{display:none!important}

/* floating pill navigation */
.nav{position:fixed;left:50%;top:12px;z-index:10;display:flex;align-items:center;gap:4px;max-width:calc(100% - 20px);padding:6px;border-radius:99px;background:#111112;color:#fff;box-shadow:0 12px 30px rgba(0,0,0,.18);transform:translateX(-50%)}
.nav-logo{display:flex;align-items:center;gap:8px;padding:0 10px 0 4px;font-weight:700;font-size:14.5px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.nav-logo img{width:30px;height:30px;border-radius:50%}
.nav-links{display:none}
.nav-links a{padding:8px 12px;border-radius:99px;font-size:14.5px;font-weight:500;color:rgba(255,255,255,.82);text-decoration:none;transition:color .2s}
.nav-links a:hover{color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;background:var(--accent);color:#fff;font:700 16px 'Inter Tight',system-ui,sans-serif;letter-spacing:-.01em;text-decoration:none;cursor:pointer;transition:transform .15s ease,filter .2s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.97)}
.btn i{font-style:normal;transition:transform .2s}
.btn:hover i{transform:translateX(3px)}
.nav .btn{height:38px;padding:0 16px;font-size:14.5px}
.btn-big{height:58px;padding:0 30px;font-size:18px}
.btn-ghost{height:42px;padding:0 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14.5px;font-weight:600}
.btn-ghost:hover{filter:none;border-color:rgba(17,17,18,.25)}

/* hero */
.hero{padding:118px 0 56px;text-align:center}
.badge{display:inline-flex;align-items:center;height:34px;margin-bottom:22px;padding:0 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:14px;font-weight:500;color:var(--mid)}
.hero h1{font-size:clamp(40px,10.5vw,84px)}
.hero p{max-width:30em;margin:20px auto 30px;font-size:clamp(17px,2.2vw,20px);color:var(--mid);text-wrap:pretty}
.hero-santos{display:block;width:fit-content;margin:18px auto 0;font-size:15px;font-weight:500;color:var(--mid);text-underline-offset:4px}
.hero-santos:hover{color:var(--ink)}

/* sections and cards */
.sec{padding:36px 0}
.grid{display:grid;gap:14px}
.card{position:relative;padding:26px 22px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.ico{display:grid;place-items:center;width:36px;height:36px;margin-bottom:22px;border-radius:50%;background:color-mix(in srgb,var(--c,var(--accent)) 12%,#fff);color:var(--c,var(--accent))}
.ico svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.label{font-size:19px;font-weight:600;letter-spacing:-.02em;color:var(--c,var(--accent))}
.card h3{margin:6px 0 16px;font-size:clamp(25px,3.4vw,30px);font-weight:700;letter-spacing:-.03em;line-height:1.14}
.checks{display:grid;gap:9px;list-style:none;font-size:15.5px}
.checks li{position:relative;padding-left:28px;text-wrap:pretty}
.checks li:before{content:"";position:absolute;left:2px;top:.42em;width:10px;height:5px;border:solid var(--c,var(--accent));border-width:0 0 2px 2px;transform:rotate(-45deg)}
.card-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.rule{max-width:34em;margin:0 auto 22px;font-size:clamp(17px,2.2vw,20px);font-weight:500;text-align:center;color:var(--mid);text-wrap:balance}
/* a photo in a card, a little crooked */
.shot{display:block;width:100%;aspect-ratio:3/2;margin-top:26px;border-radius:18px;object-fit:cover;transform:rotate(var(--tilt,-2deg));box-shadow:0 14px 30px rgba(0,0,0,.14)}

/* ranking rows (phase 2 adds the votes and the positions) */
.rank{margin-top:24px;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.rank li{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 10px 8px 16px;list-style:none}
.rank li + li{border-top:1px solid var(--line)}
.rank b{flex:1;min-width:0;font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.rank .tag{display:none} /* on a phone the button already says it is open for votes */
.rank b small{margin-left:6px;font-size:13px;font-weight:500;color:var(--mid)}
.tag{flex:none;padding:4px 10px;border-radius:99px;background:rgba(17,17,18,.06);font-size:12.5px;font-weight:600;color:var(--mid);white-space:nowrap}
.tag-on{background:color-mix(in srgb,var(--green) 13%,#fff);color:var(--green)}
.rank .btn-ghost{height:38px}
.facts{display:grid;gap:6px;margin-top:18px;font-size:15.5px}
.facts b{font-weight:600}

/* strong line + number blocks */
.strong{padding:64px 0 28px;text-align:center}
.strong h2{font-size:clamp(36px,8.6vw,64px)}
.strong h2 span{display:block}
.strong p{max-width:32em;margin:20px auto 0;font-size:clamp(17px,2.2vw,20px);color:var(--mid);text-wrap:pretty}
.nums{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:30px auto 0}
.num{flex:0 1 150px;min-width:132px;padding:18px 10px;border:1px solid var(--line);border-radius:22px;background:var(--card)}
.num b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.num small{display:block;margin-top:5px;font-size:12.5px;line-height:1.25;color:var(--mid)}

/* giant accent line */
.giant{padding:72px 0 44px;text-align:center}
.giant h2{margin-bottom:34px;font-size:clamp(40px,9.6vw,76px);color:var(--accent)}

/* a note from Nando */
.note{position:relative;width:min(660px,100%);margin:0 auto;padding:30px 24px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.note-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.note-head img{width:50px;height:50px;border-radius:50%}
.note-head b{display:block;font-size:16.5px;font-weight:700}
.note-head small{font-size:14.5px;color:var(--mid)}
.note p{margin-bottom:16px;font-size:18px;line-height:1.5;text-wrap:pretty}
.note-sign{font:600 34px/1 'Caveat',cursive}
.polas{display:flex;justify-content:center;gap:0;margin:0 0 -8px}
.pola{width:44%;padding:8px 8px 30px;background:#fff;box-shadow:0 14px 34px rgba(0,0,0,.18);transform:rotate(var(--tilt))}
.pola + .pola{margin-left:-6%}
.pola img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}

/* FAQ */
.faq{width:min(720px,100%);margin:0 auto}
.faq h2{margin-bottom:22px;font-size:clamp(32px,6vw,46px);text-align:center}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 2px;font-size:17.5px;font-weight:600;letter-spacing:-.01em;list-style:none;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"";flex:none;width:9px;height:9px;margin-right:4px;border:solid var(--mid);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .25s}
.faq details[open] summary:after{transform:rotate(-135deg)}
.faq details p{padding:0 2px 20px;color:var(--mid);text-wrap:pretty}

.final{padding:76px 0 60px;text-align:center}
.final h2{margin-bottom:30px;font-size:clamp(40px,9.6vw,72px)}
.final .hero-santos{margin-top:20px}
footer{padding:26px 0 40px;border-top:1px solid var(--line);font-size:14px;color:var(--mid)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
footer a{text-underline-offset:3px}

/* texts still to be written: hidden on the site, shown as a dashed note with ?todo */
.todo{padding:10px 12px;border:1.5px dashed var(--accent);border-radius:12px;background:color-mix(in srgb,var(--accent) 6%,#fff);font:500 13.5px/1.4 'Inter Tight',system-ui,sans-serif;letter-spacing:0;color:var(--accent);text-align:left}

@media (min-width:860px){
  .nav-links{display:flex}
  .nav-logo{padding-right:14px}
  .hero{padding:150px 0 76px}
  .sec{padding:48px 0}
  .grid{grid-template-columns:1fr 1fr}
  .card{padding:34px 30px}
  .rank .tag{display:block}
  /* an odd card at the end takes the whole row, with its text and photo side by side */
  .grid > :last-child:nth-child(odd){grid-column:1/-1}
  .grid > :last-child:nth-child(odd) .shot{max-width:440px}
  .note{padding:40px 250px 40px 40px}
  .polas{position:absolute;right:-56px;top:-36px;display:block;width:270px;margin:0}
  .pola{width:210px}
  .pola + .pola{position:absolute;right:120px;top:40px;z-index:-1;margin:0;width:170px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.btn,.btn i,.faq summary:after{transition:none}}
</style>
</head>
<body>
<nav class="nav" id="nav" aria-label="Seções"></nav>
<main id="page"></main>
<footer><div class="wrap" id="foot"></div></footer>
<noscript><p style="padding:120px 20px;text-align:center">Esta página precisa de JavaScript para mostrar a votação.</p></noscript>

<script type="module">
import config from '/palestra/config.js';
import t from '/palestra/conteudo.js';

/* ---------- helpers ---------- */
const showTodo = new URLSearchParams(location.search).has('todo');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'})[c]);
const isTodo = v => v && typeof v === 'object' && 'todo' in v;
const brl = n => `R$ ${n.toLocaleString('pt-BR')}`;
// {regra}, {duracaoPalestra}… inside a text are filled in from the config
const fill = s => esc(s).replace(/\{(\w+)\}/g, (_, k) => esc(k === 'regra' ? rule() : config[k] ?? ''));
// a text, or (with ?todo) a note saying what is still to be written, or nothing
const text = (v, wrap = x => x) => isTodo(v) ? (showTodo ? `<div class="todo">TODO_COPY: ${esc(v.todo)}</div>` : '') : v ? wrap(fill(v)) : '';
const has = v => v && (!isTodo(v) || showTodo);
const checks = v => isTodo(v) ? text(v) : `<ul class="checks">${v.map(i => `<li>${fill(i)}</li>`).join('')}</ul>`;
const ICON = {
  globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.800 0 18M12 3c-3 3.200-3 14.800 0 18"/>',
  pin: '<path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.800 7 11 7 11z"/><circle cx="12" cy="10" r="2.500"/>',
  split: '<path d="M4 6h7v12H4zM13 6h7v12h-7z"/>',
  people: '<circle cx="9" cy="8" r="3.200"/><path d="M3 20c.4-3.600 2.800-5.500 6-5.500s5.600 1.900 6 5.500M16 5.200a3.200 3.200 0 0 1 0 5.900M18.500 14.900c1.500.9 2.300 2.500 2.500 5.100"/>',
  bolt: '<path d="M13 3 5 13.500h6L10 21l8-10.500h-6z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.200 2"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.500 11a6.500 6.500 0 0 0 13 0M12 17.500V21"/>',
  spark: '<path d="M12 3v6M12 15v6M3 12h6M15 12h6"/>',
};
const card = ({icon, c, label, title, body = '', id = ''}) => `
  <article class="card" ${id ? `id="${id}"` : ''} style="--c:var(--${c})">
    <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24">${ICON[icon]}</svg></span>
    <p class="label">${esc(label)}</p>
    ${text(title, x => `<h3>${x}</h3>`)}
    ${body}
  </article>`;

/* ---------- facts from the config ---------- */
const cities = config.cidadesVotacao, rules = config.regraAbertura;
const price = (config.lotesReferencia || []).find(l => l.ativo && l.preco != null)?.preco ?? null;
// the rule in one sentence, with the numbers of the config
function rule() {
  const second = rules.maxCidades > 1 ? ` A segunda também, se passar de ${rules.minimoSegunda} votos.` : '';
  return `A cidade mais votada recebe a palestra, com pelo menos ${rules.minimoPrimeira} votos.${second}`;
}
const deadline = rules.votacaoEncerraEm ? new Date(rules.votacaoEncerraEm) : null;
const open = config.modo === 'votacao' && (!deadline || deadline > new Date());
const dateBR = iso => new Date(`${iso}T12:00:00`).toLocaleDateString('pt-BR', {day:'numeric', month:'long', year:'numeric'});

/* ---------- sections ---------- */
const santos = config.santos;
const santosFacts = [
  santos.data && ['Data', dateBR(santos.data)],
  santos.horarioManha && ['Manhã', santos.horarioManha],
  santos.horarioTarde && ['Tarde', santos.horarioTarde],
  santos.local && ['Local', santos.local],
].filter(Boolean);
const santosButton = t.santos.botao[santos.status];

const numbers = [
  config.duracaoImersao && [config.duracaoImersao, t.numeros.imersao],
  cities.length && [cities.length, t.numeros.cidades],
  // total de votos: entra na fase 2, vindo do banco
  price != null && [brl(price), t.numeros.entrada],
].filter(Boolean);

const confirmed = config.palestrantes.filter(p => p.confirmado);

document.getElementById('nav').innerHTML = `
  <a class="nav-logo" href="/"><img src="/img/avatar-160.webp" width="30" height="30" alt="" />Nando Voyager</a>
  <span class="nav-links"><a href="#votacao">${esc(t.nav.votacao)}</a><a href="#santos">${esc(t.nav.imersao)}</a><a href="#duvidas">${esc(t.nav.duvidas)}</a></span>
  ${open ? `<a class="btn" href="#votacao">${esc(t.nav.votar)} <i aria-hidden="true">→</i></a>` : ''}`;

document.getElementById('page').innerHTML = `
  <section class="hero wrap">
    ${deadline && open ? `<p class="badge">${esc(t.hero.prazo)}&nbsp;<span id="countdown"></span></p>` : ''}
    <h1>${fill(t.hero.titulo)}</h1>
    <p>${fill(t.hero.promessa)}</p>
    ${open ? `<a class="btn btn-big" href="#votacao">${esc(t.hero.botao)} <i aria-hidden="true">→</i></a>` : ''}
    <a class="hero-santos" href="#santos">${esc(t.hero.linkSantos)}</a>
  </section>

  <!-- fase 2: o mapa entra aqui -->

  <section class="sec wrap" id="votacao">
    <p class="rule">${esc(rule())}</p>
    <div class="grid">
      ${card({icon:'globe', c:'green', label:t.votacao.rotulo, title:t.votacao.titulo, body:`
        ${checks(t.votacao.itens)}
        <ul class="rank">${cities.map(c => `
          <li id="cidade-${esc(c.id)}"><b>${esc(c.nome)}<small>${esc(c.uf)}</small></b><span class="tag">${esc(t.votacao.selo[c.status])}</span>
          ${c.status === 'votacao' && open ? `<button class="btn btn-ghost" type="button" data-votar="${esc(c.id)}">${esc(t.votacao.votar)}</button>` : ''}</li>`).join('')}
        </ul>`})}
      ${card({icon:'pin', c:'accent', id:'santos', label:t.santos.rotulo, title:t.santos.titulo, body:`
        ${checks(t.santos.itens)}
        <div class="facts">
          ${santosFacts.map(([k, v]) => `<p><b>${esc(k)}:</b> ${esc(v)}</p>`).join('')}
          <p><span class="tag tag-on">${santos.vagasRestantes != null ? `${santos.vagasRestantes} vagas restantes` : esc(t.santos.vagasLimitadas)}</span></p>
        </div>
        ${santosButton ? `<div class="card-actions"><button class="btn btn-ghost" type="button" data-santos>${esc(santosButton)} ›</button></div>` : ''}
        <img class="shot" style="--tilt:2deg" src="/img/fabrica-900.webp" alt="" loading="lazy" />`})}
    </div>
  </section>

  <section class="strong wrap">
    <h2>${t.fraseForte.titulo.map(l => `<span>${fill(l)}</span>`).join('')}</h2>
    ${text(t.porQueAgora, x => `<p>${x}</p>`)}
    <div class="nums">${numbers.map(([n, l]) => `<div class="num"><b>${esc(n)}</b><small>${esc(l)}</small></div>`).join('')}</div>
  </section>

  <section class="sec wrap">
    <div class="grid">
      ${card({icon:'split', c:'green', label:t.cards.formatos.rotulo, title:t.cards.formatos.titulo, body:checks(t.cards.formatos.itens)})}
      ${has(t.cards.quem.itens) ? card({icon:'people', c:'blue', label:t.cards.quem.rotulo, title:t.cards.quem.titulo, body:checks(t.cards.quem.itens) + '<img class="shot" src="/img/canton-cracha-1200.webp" alt="" loading="lazy" />'}) : ''}
      ${has(t.cards.leva.itens) ? card({icon:'bolt', c:'accent', label:t.cards.leva.rotulo, title:t.cards.leva.titulo, body:checks(t.cards.leva.itens)}) : ''}
      ${has(t.cards.formato.itens) ? card({icon:'clock', c:'blue', label:t.cards.formato.rotulo, title:t.cards.formato.titulo, body:checks(t.cards.formato.itens)}) : ''}
      ${card({icon:'mic', c:'ink', label:t.cards.palestrantes.rotulo, title:confirmed.length ? t.cards.palestrantes.comConfirmados : t.cards.palestrantes.semConfirmados, body:`
        <ul class="checks">
          <li>${esc(t.cards.palestrantes.eu)}</li>
          ${confirmed.map(p => `<li>${esc(p.nome)}${p.cargo || p.empresa ? `, ${esc([p.cargo, p.empresa].filter(Boolean).join(', '))}` : ''}</li>`).join('')}
          ${config.parceiro.mostrar ? `<li>Parceiro: ${esc(config.parceiro.nome)}</li>` : ''}
        </ul>
        ${config.palestrar.mostrar || config.patrocinio.mostrar ? `<div class="card-actions">
          ${config.palestrar.mostrar ? `<a class="btn btn-ghost" href="/palestra/palestrar">${esc(t.cards.palestrantes.palestrar)} ›</a>` : ''}
          ${config.patrocinio.mostrar ? `<a class="btn btn-ghost" href="/palestra/patrocinio">${esc(t.cards.palestrantes.patrocinar)} ›</a>` : ''}</div>` : ''}`})}
      ${config.deepchina.mostrar ? card({icon:'spark', c:'blue', label:t.cards.deepchina.rotulo, title:t.cards.deepchina.titulo, body:`<p>${fill(config.deepchina.textoOferta || t.cards.deepchina.oferta)}</p><img class="shot" style="--tilt:1.500deg;aspect-ratio:2.100/1.320" src="/img/deepchina-card.webp" alt="" loading="lazy" />`}) : ''}
    </div>
  </section>

  <section class="giant wrap">
    ${text(t.fraseGigante, x => `<h2>${x}</h2>`)}
    ${open ? `<a class="btn btn-big" href="#votacao">${esc(t.hero.botao)} <i aria-hidden="true">→</i></a>` : ''}
  </section>

  ${has(t.recado.paragrafos) ? `<section class="sec wrap">
    <div class="note">
      <div class="polas" aria-hidden="true"><div class="pola" style="--tilt:5deg"><img src="/img/moto-900.webp" alt="" loading="lazy" /></div><div class="pola" style="--tilt:-6deg"><img src="/img/carro-1000.webp" alt="" loading="lazy" /></div></div>
      <div class="note-head"><img src="/img/avatar-160.webp" width="50" height="50" alt="" /><p><b>${esc(t.recado.titulo)}</b><small>@nandovoyager</small></p></div>
      ${isTodo(t.recado.paragrafos) ? text(t.recado.paragrafos) : t.recado.paragrafos.map(p => `<p>${fill(p)}</p>`).join('')}
      <p class="note-sign">${esc(t.recado.assinatura)}</p>
      ${open ? `<div class="card-actions"><a class="btn" style="height:50px;padding:0 24px" href="#votacao">${esc(t.hero.botao)} <i aria-hidden="true">→</i></a></div>` : ''}
    </div>
  </section>` : ''}

  <section class="sec wrap" id="duvidas">
    <div class="faq">
      <h2>${esc(t.faq.titulo)}</h2>
      ${t.faq.itens.filter(i => has(i.r)).map(i => `<details><summary>${esc(i.p)}</summary>${text(i.r, x => `<p>${x}</p>`)}</details>`).join('')}
    </div>
  </section>

  <section class="final wrap">
    <h2>${fill(t.final.titulo)}</h2>
    ${open ? `<a class="btn btn-big" href="#votacao">${esc(t.hero.botao)} <i aria-hidden="true">→</i></a>` : ''}
    <a class="hero-santos" href="#santos">${esc(t.final.botaoSantos)}</a>
  </section>`;

document.getElementById('foot').innerHTML = `<span>© ${new Date().getFullYear()} Nando Voyager</span><span><a href="/privacidade.html">${esc(t.rodape.privacidade)}</a> · <a href="/">${esc(t.rodape.voltar)}</a></span>`;

/* ---------- countdown to the real closing date ---------- */
const clock = document.getElementById('countdown');
if (clock) {
  const tick = () => {
    const s = Math.max(0, Math.floor((deadline - Date.now()) / 1000)), two = n => String(n).padStart(2, '0');
    clock.textContent = `${Math.floor(s / 86400)}d ${two(Math.floor(s / 3600) % 24)}h ${two(Math.floor(s / 60) % 60)}m ${two(s % 60)}s`;
  };
  tick(); setInterval(tick, 1000);
}
// fase 3: os botões [data-votar] e [data-santos] abrem os formulários de voto e de interesse
</script>
</body>
