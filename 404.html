<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0a0b" />
<meta name="robots" content="noindex" />
<title>Página não encontrada — Nando Voyager</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/icon.png" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=IBM+Plex+Mono:wght@400&family=Inter+Tight:wght@400;500;600&display=swap" />
<style>
:root{--bg:#0a0a0b;--ink:#f4f1ea;--mid:#8d8b86}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:'Inter Tight',system-ui,sans-serif;text-align:center;-webkit-font-smoothing:antialiased}
.code{font:400 12px 'IBM Plex Mono',monospace;letter-spacing:.08em;color:var(--mid)}
h1{margin-top:12px;font-size:clamp(30px,6vw,46px);font-weight:500;line-height:1.15;letter-spacing:-.02em}
h1 span{font:600 1.35em/1 'Caveat',cursive;letter-spacing:0}
p{margin-top:12px;color:var(--mid)}
a{display:inline-flex;align-items:center;gap:8px;height:46px;margin-top:28px;padding:0 22px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:600;letter-spacing:.08em;text-decoration:none}
</style>
</head>
<body>
<main>
  <p class="code">ERRO 404</p>
  <h1>Essa página <span>não existe</span></h1>
  <p>O link pode ter mudado.</p>
  <a href="/">VOLTAR PARA O INÍCIO <span aria-hidden="true">→</span></a>
</main>
</body>
</html>
