<style>
:root{--bg:#0a0a0b;--ink:#f4f1ea;--mid:#8d8b86;--line:rgba(244,241,234,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{font-family:'Inter Tight',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
/* One screen: the first scroll plays the whole animation, which ends on the links (see the script). */
.stage{position:relative;height:100vh;height:100svh;overflow:hidden;background:var(--bg)}
.hl{position:absolute;left:0;right:0;font-weight:400;font-size:clamp(40px,6.7vw,130px);line-height:1;letter-spacing:-.055em;white-space:nowrap;text-align:center;will-change:transform}
#l1{top:calc(50% - .98em)}
#l2{top:calc(50% + .03em)}
#l1 span,#l2 span{display:inline-block}
#l1 span{margin-right:15vw}
#l2 span{margin-left:15vw}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.top{position:absolute;left:32px;right:32px;top:26px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.top{justify-content:flex-start}.acts{margin-left:auto}
#pager{display:flex;margin:-26px 0 0 28px;pointer-events:auto}
#pager span{display:grid;place-items:center;width:44px;height:50px;border:1px solid var(--line);border-top:0;margin-left:-1px;font:400 11px 'IBM Plex Mono',monospace;color:var(--mid)}
#glow{position:absolute;left:0;right:0;top:0;height:42%;background:linear-gradient(rgba(244,241,234,.1),rgba(244,241,234,0))}
#cross{position:absolute;left:32px;right:32px;top:37.5%;height:1px;background:var(--line)}
#cross i{position:absolute;left:50%;top:-.62em;margin-left:-.3em;font:400 13px 'IBM Plex Mono',monospace;color:var(--mid);background:var(--bg);padding:0 .3em;line-height:1.2}
.logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:600;letter-spacing:.09em;color:var(--ink);text-decoration:none;pointer-events:auto}
.acts{display:flex;align-items:center;gap:7px;pointer-events:auto}
.acts a{display:flex;align-items:center;gap:9px;height:32px;padding:0 15px;border:1px solid rgba(244,241,234,.55);border-radius:99px;color:var(--ink);text-decoration:none;font-size:12px;font-weight:500;letter-spacing:.06em;transition:background .2s,color .2s}
.acts a:hover{background:var(--ink);color:var(--bg)}
.acts a i{width:6px;height:6px;border-radius:50%;background:currentColor}
.acts a b{display:block;width:13px;height:7px;border-top:1px solid currentColor;border-bottom:1px solid currentColor}
/* first frame only: tells the visitor that scrolling drives the page */
#cue{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);padding:8px 12px;border:0;background:none;font:400 11.5px 'IBM Plex Mono',monospace;letter-spacing:.06em;color:var(--mid);white-space:nowrap;cursor:pointer}
#cue:hover{color:var(--ink)}
#rule{position:absolute;left:3.5vw;right:3.5vw;top:50%;height:1px;background:var(--line);transform-origin:left;transform:scaleX(0)}

/* The links: each card of the ribbon lands in one of these slots (.tile-img) and the label sits on top. */
.hub{position:absolute;top:84px;bottom:24px;left:32px;right:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;pointer-events:none}
.tiles{--gw:min(56vw,(100svh - 320px) * 1.55);width:var(--gw);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(var(--gw) * .0272) calc(var(--gw) * .017);list-style:none}
.tile{position:relative;display:block;aspect-ratio:2.1/1.32;border-radius:6px;color:var(--ink);text-decoration:none;opacity:0;visibility:hidden;pointer-events:auto;transition:transform .3s cubic-bezier(.2,.7,.2,1)}
.tile:hover{transform:scale(1.03)}
.tile:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.tile-img{position:absolute;inset:0;border-radius:inherit}
.tile:before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(rgba(10,10,11,0) 38%,rgba(10,10,11,.8))}
.tile-n{position:absolute;left:14px;top:12px;font:400 11px 'IBM Plex Mono',monospace;font-style:normal;letter-spacing:.06em;color:rgba(244,241,234,.8);text-shadow:0 1px 6px rgba(0,0,0,.4)}
.tile-text{position:absolute;left:16px;right:56px;bottom:14px}
.tile-text b{display:block;font-size:clamp(18px,1.8vw,30px);font-weight:500;line-height:1.1;letter-spacing:-.02em}
.tile-text small{display:block;margin-top:4px;font-size:12.5px;line-height:1.3;color:rgba(244,241,234,.74)}
.tile-go{position:absolute;right:14px;bottom:14px;display:grid;place-items:center;width:32px;height:32px;border:1px solid rgba(244,241,234,.55);border-radius:50%;font-size:14px;transition:background .2s,color .2s}
.tile:hover .tile-go{background:var(--ink);color:var(--bg)}

/* E-mail signup: bottom centre on a wide screen, under the links on a phone. */
.join{position:relative;width:min(440px,100%);pointer-events:auto}
.join label{display:block;margin-bottom:8px;font:400 11px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mid);text-align:center}
.join-row{display:flex;gap:6px}
.join input{flex:1;min-width:0;height:40px;padding:0 16px;border:1px solid rgba(244,241,234,.35);border-radius:99px;background:rgba(244,241,234,.04);color:var(--ink);font:400 14px 'Inter Tight',system-ui,sans-serif;outline:0}
.join input::placeholder{color:var(--mid)}
.join input:focus{border-color:var(--ink)}
.join button{flex:none;height:40px;padding:0 18px;border:0;border-radius:99px;background:var(--ink);color:var(--bg);font:600 12px 'Inter Tight',system-ui,sans-serif;letter-spacing:.06em;cursor:pointer}
.join button:disabled{opacity:.6;cursor:default}
.join .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.join-msg{position:absolute;left:0;right:0;top:100%;margin-top:6px;font-size:12px;text-align:center;color:var(--mid)}
.join-msg[data-state=error]{color:#ffb4a8}
.join-msg[data-state=success]{position:static;margin:0;font-size:13px;color:var(--ink)}
/* Social icons: in the top bar on a wide screen, a row above the links on a phone. LinkedIn shows once site-config.js has it. */
.top-socials{display:flex;align-items:center;margin-right:10px}
.top-socials a{display:grid;place-items:center;width:36px;height:36px;padding:0;border:0;border-radius:50%;color:rgba(244,241,234,.78)}
.top-socials a:hover{background:none;color:var(--ink)}
.socials{display:none;gap:10px;justify-content:center;pointer-events:auto}
.socials a{display:grid;place-items:center;width:40px;height:40px;border:1px solid rgba(244,241,234,.35);border-radius:50%;color:var(--ink);transition:background .2s,color .2s,border-color .2s}
.socials a:hover{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.top-socials a[hidden],.socials a[hidden]{display:none}
/* Signup and icons open once the links have landed (.is-open): the signup rises, then the icons one after another. */
.join,.socials a,.top-socials a{opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .7s cubic-bezier(.2,.7,.2,1),transform .7s cubic-bezier(.2,.7,.2,1),visibility 0s .7s,background .2s,color .2s,border-color .2s}
.top-socials a{transform:translateY(-8px)}
.is-open .join,.is-open .socials a,.is-open .top-socials a{opacity:1;visibility:visible;transform:none;transition-delay:var(--d,0s),var(--d,0s),0s,0s,0s,0s}
.socials a:nth-child(1),.top-socials a:nth-child(1){--d:.18s}
.socials a:nth-child(2),.top-socials a:nth-child(2){--d:.25s}
.socials a:nth-child(3),.top-socials a:nth-child(3){--d:.32s}
.socials a:nth-child(4),.top-socials a:nth-child(4){--d:.39s}
.socials a:nth-child(5),.top-socials a:nth-child(5){--d:.46s}
@media (prefers-reduced-motion:reduce){.join,.socials a,.top-socials a{transition:none}}
.top-socials svg,.socials svg{width:17px;height:17px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:760px){
  .top{left:18px;right:18px;top:18px}#cue{bottom:18px}
  #pager{display:none}
}
/* Phones (portrait): a link-in-bio column, the cards land as thumbnails on the left of each row. */
@media (max-aspect-ratio:9/10){
  #rule,.acts a.site{display:none}
  .hub{top:62px;bottom:14px;left:18px;right:18px;max-width:480px;margin:0 auto;align-items:stretch;gap:16px}
  .tiles{width:auto;display:flex;flex-direction:column;gap:8px}
  .tile{display:flex;align-items:center;gap:12px;aspect-ratio:auto;padding:6px 16px 6px 6px;border:1px solid var(--line);border-radius:14px;background:rgba(244,241,234,.035)}
  .tile:hover{transform:none}
  .tile:before,.tile-n{display:none}
  .tile-img{position:relative;inset:auto;flex:none;width:clamp(72px,13svh,112px);aspect-ratio:2.1/1.32;border-radius:8px}
  .tile-text{position:static;flex:1;min-width:0}
  .tile-text b{font-size:17px}
  .tile-text small{margin-top:2px;font-size:12.5px;color:var(--mid)}
  .tile-go{position:static;width:auto;height:auto;border:0;font-size:15px;color:var(--mid)}
  .join{width:auto}
  .join label{font:400 13px 'Inter Tight',system-ui,sans-serif;letter-spacing:0;text-transform:none;color:var(--ink)}
  .join input,.join button{height:44px}
  .top-socials{display:none}
  .socials{display:flex}
}
</style>

<script type="module">
import * as THREE from 'three';

// One card per link (same order as #tiles), then two more that only ride the ribbon.
const WORK = [
  {img:'/img/shanghai-720.webp'},
  {img:'/img/og.jpg'},
  {img:'/img/fabrica-900.webp'},
  {img:'/img/canton-fachada-900.webp'},
  {img:'/media/bastidores-poster.webp', video:'/media/bastidores.mp4'},
  {img:'/img/clientes-640.webp'},
  {img:'/img/shanghai-1245.webp'},
  {img:'/img/canton-fachada-1600.webp'},
];
const config = window.NANDO_SITE_CONFIG || {};
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const mix = (a, b, t) => a + (b - a) * t;
const ease = t => t * t * (3 - 2 * t);
const out = t => 1 - (1 - t) ** 3;
const span = (p, a, b) => clamp((p - a) / (b - a));

const stage = $('stage'), tiles = [...document.querySelectorAll('.tile')];
document.querySelectorAll('[data-social]').forEach(a => { const web = config.socialLinks?.[a.dataset.social]?.web; if (web) { a.href = web; a.hidden = false; } });
if (config.deepchinaUrl) document.querySelectorAll('[data-deepchina]').forEach(a => { a.href = config.deepchinaUrl; a.target = '_blank'; a.rel = 'noreferrer'; });

/* ---------- renderer ---------- */
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setClearColor(0, 0);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
const scene = new THREE.Scene();
const FOV = 35, camera = new THREE.PerspectiveCamera(FOV, 1, .1, 100);

/* ---------- ribbon path ---------- */
let path, PATH_L = 1;
const SAMPLES = 1200, pathP = [], pathT = [];
const PH0 = -1.5, PH1 = Math.PI * 2 + 1.35;
function buildPath() {
  const pts = [];
  for (let i = 0; i <= 160; i++) {
    const t = i / 160, ph = mix(PH0, PH1, t), cs = Math.cos(ph), u = 2 * t - 1;
    // a shallow arc close to the camera, then long runs far behind it
    const depth = cs > 0 ? 7.6 + 16.4 * cs ** .9 : 7.6 + 2.2 * cs;
    const edge = .84 + .5 * span(.14 - t, 0, .14) + .8 * span(t, .84, 1);
    pts.push(new THREE.Vector3(edge * Math.sin(ph) * depth * .561, .5 * Math.sign(u) * Math.abs(u) ** 1.4 * depth * .63, -depth));
  }
  path = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  path.arcLengthDivisions = 1500;
  PATH_L = path.getLength(); pathP.length = pathT.length = 0;
  for (let i = 0; i <= SAMPLES; i++) { const u = i / SAMPLES; pathP.push(path.getPointAt(u)); pathT.push(path.getTangentAt(u)); }
}
const at = (s, op, ot) => {
  const f = clamp(s / PATH_L) * SAMPLES, i = Math.min(SAMPLES - 1, Math.floor(f)), k = f - i;
  op.lerpVectors(pathP[i], pathP[i + 1], k); ot.lerpVectors(pathT[i], pathT[i + 1], k).normalize();
};

/* ---------- cards ---------- */
const CARD_W = 2.1, CARD_H = 1.32, GAP = .03, STEP = CARD_W + GAP, NX = 28, NY = 3, RADIUS = .018;
const vs = `varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`;
const fs = `uniform sampler2D map;uniform vec2 cover;uniform float aspect,ready,radius;varying vec2 vUv;
void main(){
  vec2 q=(abs(vUv-.5)-.5)*vec2(aspect,1.)+radius;
  float d=length(max(q,0.))+min(max(q.x,q.y),0.)-radius;
  float px=fwidth(d),a=1.-smoothstep(-px,px,d);
  if(a<.01)discard;
  vec2 uv=vUv;if(!gl_FrontFacing)uv.x=1.-uv.x;
  vec3 c=mix(vec3(.075),texture2D(map,(uv-.5)*cover+.5).rgb,ready);
  float edge=smoothstep(-.012-px,-.012,d);
  gl_FragColor=vec4(mix(c,vec3(1.),edge*.1),a);
}`;
// cover fit from the picture's aspect ratio, then show it
const fit = (c, w, h) => {
  const va = w / h, ca = CARD_W / CARD_H;
  c.mat.uniforms.cover.value.set(va > ca ? ca / va : 1, va > ca ? 1 : va / ca);
  c.mat.uniforms.ready.value = 1;
};
const cards = WORK.map(({img, video}, i) => {
  // still pictures get mipmaps, so they stay clean when the ribbon is far away
  const tex = new THREE.Texture();
  tex.colorSpace = THREE.NoColorSpace; tex.minFilter = THREE.LinearMipmapLinearFilter; tex.magFilter = THREE.LinearFilter;
  const geo = new THREE.PlaneGeometry(1, 1, NX, NY);
  const mat = new THREE.ShaderMaterial({vertexShader:vs, fragmentShader:fs, transparent:true, side:THREE.DoubleSide,
    uniforms:{map:{value:tex}, cover:{value:new THREE.Vector2(1, 1)}, aspect:{value:CARD_W / CARD_H}, ready:{value:0}, radius:{value:RADIUS}}});
  const mesh = new THREE.Mesh(geo, mat); mesh.frustumCulled = false; scene.add(mesh);
  const c = {i, v:null, tex, geo, mat, mesh, hover:0, hoverT:0};
  const pic = new Image();
  pic.onload = () => { if (c.v && c.v.readyState >= 2) return; tex.image = pic; tex.needsUpdate = true; fit(c, pic.naturalWidth, pic.naturalHeight); };
  pic.src = img;
  if (video) {
    // the poster shows until the video can play, then the card runs the video
    const v = c.v = document.createElement('video');
    Object.assign(v, {crossOrigin:'anonymous', muted:true, loop:true, playsInline:true, preload:'auto', src:video});
    v.setAttribute('playsinline', '');
    v.addEventListener('loadeddata', () => {
      const vt = new THREE.VideoTexture(v);
      vt.colorSpace = THREE.NoColorSpace; vt.minFilter = THREE.LinearFilter; vt.magFilter = THREE.LinearFilter; vt.generateMipmaps = false;
      mat.uniforms.map.value = vt; fit(c, v.videoWidth, v.videoHeight);
    }, {once:true});
  }
  return c;
});

/* ---------- layout ---------- */
const GZ = 8, phone = matchMedia('(max-aspect-ratio: 9/10)');
let W = 1, H = 1, asp = 1, cols = 3, rows = 2, tanH = .3153, slots = [];
function resize() {
  W = stage.clientWidth; H = stage.clientHeight; asp = W / H;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(W, H, false);
  camera.aspect = asp; camera.fov = asp < 16 / 9 ? Math.atan(.561 / asp) * 360 / Math.PI : FOV; camera.updateProjectionMatrix();
  tanH = Math.tan(camera.fov * Math.PI / 360);
  cols = phone.matches ? 1 : 2; rows = Math.ceil(tiles.length / cols);
  // the HTML lays out the links; each card lands exactly on its slot
  const box = stage.getBoundingClientRect();
  slots = tiles.map(t => { const r = t.querySelector('.tile-img').getBoundingClientRect(); return {x:r.left - box.left, y:r.top - box.top, w:r.width, h:r.height}; });
  if (cols > 1) $('rule').style.top = `${(slots[0].y + slots[0].h + slots[cols].y) / 2}px`;
}
addEventListener('resize', resize); resize(); buildPath();
document.fonts.ready.then(resize);
function grid(i) {
  const vh = 2 * GZ * tanH, vw = vh * asp, s = slots[i];
  return {x:((s.x + s.w / 2) / W - .5) * vw, y:(.5 - (s.y + s.h / 2) / H) * vh, w:s.w / W * vw, h:s.h / H * vh, px:s.h, vw, vh, c:i % cols, r:Math.floor(i / cols)};
}

/* ---------- progress ---------- */
// One scroll down (wheel, swipe or key), or the "role para ver" button, plays the whole animation; it ends with
// every link open and stays there. A visitor who asked for less motion gets the links at once.
const DURATION = 4800;
const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
let start = null, target = 0, p = 0;
const play = () => { if (start === null) start = calm ? -Infinity : performance.now(); };
addEventListener('wheel', e => { if (e.deltaY > 0) play(); }, {passive:true});
let touchY = null;
addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, {passive:true});
addEventListener('touchmove', e => { if (touchY !== null && touchY - e.touches[0].clientY > 12) play(); }, {passive:true});
addEventListener('keydown', e => { if (['ArrowDown', 'PageDown', 'End', ' '].includes(e.key) && !e.target.closest('input')) play(); });
$('cue').addEventListener('click', play);

/* ---------- pose ---------- */
const op = new THREE.Vector3(), ot = new THREE.Vector3(), up = new THREE.Vector3(), Y = new THREE.Vector3(0, 1, 0), vp = new THREE.Vector3();
function poseRibbon(c, head) {
  const pos = c.geo.attributes.position, centre = head - c.i * STEP;
  c.mat.uniforms.radius.value = RADIUS;
  for (let iy = 0; iy <= NY; iy++) for (let ix = 0; ix <= NX; ix++) {
    const k = iy * (NX + 1) + ix, lu = ix / NX - .5, lv = .5 - iy / NY;
    at(centre + lu * CARD_W, op, ot);
    // keep the sheet upright, leaning a little into the turn
    up.copy(Y).addScaledVector(ot, -Y.dot(ot)).normalize();
    vp.copy(op).addScaledVector(up, lv * CARD_H);
    pos.setXYZ(k, vp.x, vp.y, vp.z);
  }
  pos.needsUpdate = true;
}
function poseGrid(c, q) {
  const g = grid(c.i), pos = c.geo.attributes.position, mid = (cols - 1) / 2;
  const dx = (g.c - mid) * 1.2, dy = g.r < rows / 2 ? 1 : -1;
  const ox = dx * g.vw * .62 * (1 - q), oy = dy * g.vh * (cols === 3 && g.c === 1 ? .95 : .34) * (1 - q), tilt = (1 - q) * .22 * (g.c - mid || .5) * dy;
  const cs = Math.cos(tilt), sn = Math.sin(tilt), grow = 1 + .03 * c.hover; // grows with its tile on hover
  // corners round off to the slot's radius as the card lands (6px on the grid, 8px on the phone rows)
  c.mat.uniforms.radius.value = mix(RADIUS, (cols > 1 ? 6 : 8) / g.px, q);
  for (let iy = 0; iy <= NY; iy++) for (let ix = 0; ix <= NX; ix++) {
    const k = iy * (NX + 1) + ix, x = (ix / NX - .5) * g.w * grow, y = (.5 - iy / NY) * g.h * grow;
    pos.setXYZ(k, g.x + ox + x * cs - y * sn, g.y + oy + x * sn + y * cs, -GZ - (1 - q) * .6 * Math.sin(ix / NX * Math.PI));
  }
  pos.needsUpdate = true;
}
// a tile's label shows once its card has landed under it
function showTile(el, q) {
  const o = span(q, .97, 1);
  el.style.opacity = o; el.style.visibility = o > .02 ? 'visible' : 'hidden';
}

const RIB_A = .14, RIB_B = .63;
function render() {
  const pp = p;
  // headline runs right across the page in opposite directions
  const rise = 1 - out(span(pp, 0, .12));
  const run = mix(-50, 76, span(pp, 0, .58));
  $('l1').style.transform = `translate3d(${run}vw,${rise * 34}vh,0)`;
  $('l2').style.transform = `translate3d(${-run}vw,${rise * 34}vh,0)`;
  $('l1').style.opacity = $('l2').style.opacity = 1 - span(pp, .56, .62);
  const intro = 1 - span(pp, 0, .05);
  for (const id of ['cue', 'pager', 'cross', 'glow']) $(id).style.opacity = intro;
  $('cue').style.visibility = intro > 0 ? '' : 'hidden';
  $('rule').style.transform = `scaleX(${ease(span(pp, .72, .86))})`;
  stage.classList.toggle('is-open', pp > .8);
  // ribbon, then the links
  const pr = span(pp, RIB_A, RIB_B), head = mix(0, PATH_L + cards.length * STEP, pr);
  for (const c of cards) {
    const s = head - c.i * STEP, end = PATH_L - CARD_W;
    if (s < end) {
      c.mesh.visible = s > CARD_W;
      if (c.mesh.visible) poseRibbon(c, head);
      if (tiles[c.i]) showTile(tiles[c.i], 0);
    } else if (c.i < tiles.length) {
      // each card flies to its slot the moment it leaves the rail
      const st = mix(RIB_A, RIB_B, (end + c.i * STEP) / (PATH_L + cards.length * STEP)), q = out(span(pp, st, st + .13));
      c.mesh.visible = q > .001;
      if (c.mesh.visible) poseGrid(c, q);
      showTile(tiles[c.i], q);
    } else c.mesh.visible = false;
  }
  renderer.render(scene, camera);
}

/* ---------- hover ---------- */
tiles.forEach((t, i) => {
  t.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse' && cols > 1) cards[i].hoverT = 1; });
  t.addEventListener('pointerleave', () => { cards[i].hoverT = 0; });
});

/* ---------- e-mail signup (same endpoint and answers as the main page) ---------- */
const form = $('join'), msg = $('join-msg'), button = form.querySelector('button');
const say = (text, state) => { msg.textContent = text; if (state) msg.dataset.state = state; else delete msg.dataset.state; };
form.addEventListener('submit', async e => {
  e.preventDefault();
  if (!form.reportValidity()) return;
  const email = form.email.value.trim();
  if (!config.signupEndpoint) return say('Inscrições ainda não estão conectadas.', 'error');
  button.disabled = true; say('Enviando…');
  try {
    const r = await fetch(config.signupEndpoint, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email, website:form.website.value})});
    const result = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(result.error || 'Não foi possível concluir sua inscrição.');
    form.querySelector('.join-row').hidden = true; form.querySelector('label').hidden = true;
    say('Recebido! Minha equipe vai entrar em contato com você.', 'success');
  } catch (error) {
    say(error.message || 'Algo deu errado. Tente novamente em instantes.', 'error');
  } finally {
    button.disabled = false;
  }
});

/* ---------- loop ---------- */
function loop(now) {
  target = start === null ? 0 : clamp((now - start) / DURATION);
  p = start === -Infinity ? 1 : p + (target - p) * .09;
  if (Math.abs(target - p) < .00005) p = target;
  for (const c of cards) {
    c.hover += (c.hoverT - c.hover) * .18;
    if (!c.v) continue;
    if (c.mesh.visible && c.v.paused) c.v.play().catch(() => {});
    else if (!c.mesh.visible && !c.v.paused) c.v.pause();
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
